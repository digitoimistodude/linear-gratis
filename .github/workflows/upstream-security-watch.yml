name: Upstream security watch

# We deliberately do not merge upstream any more, so this is the only thing that
# tells us when curiousgeorgios/linear-gratis ships a security fix. Runs on
# GitHub rather than a laptop so it keeps working when nobody is at a desk.
#
# Notification is a deliberate job failure: issues are disabled on this repo, so
# a red run plus GitHub's own failure email is the channel that needs no secrets
# and cannot silently stop working. The report itself is in the run summary.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Scan upstream for security-relevant commits
        id: scan
        run: |
          node .github/scripts/check-upstream-security.mjs > report.md
          echo "new_state=$(grep '^NEW_STATE=' report.md | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          if grep -qE '^## (Security|Worth a look)' report.md; then
            echo "hits=true" >> "$GITHUB_OUTPUT"
          else
            echo "hits=false" >> "$GITHUB_OUTPUT"
          fi
          sed -i '/^NEW_STATE=/d' report.md
          cat report.md

      - name: Write the run summary
        env:
          HITS: ${{ steps.scan.outputs.hits }}
          NEW_STATE: ${{ steps.scan.outputs.new_state }}
        run: |
          if [ "$HITS" = "true" ]; then
            echo "# Upstream security commits to review" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            cat report.md >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "## To clear this" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "Port what applies, set \`.github/upstream-watch-state\` to \`$NEW_STATE\`, commit, then re-run. This job stays red until that SHA moves, which is deliberate - a green run must mean reviewed, not ignored." >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "Context: [DEV-1222](https://linear.app/dude/issue/DEV-1222). Why we stopped merging: [DEV-1199](https://linear.app/dude/issue/DEV-1199)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "# No security-relevant upstream commits" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            cat report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      # Failing is the notification. GitHub emails on a failed scheduled run and
      # shows a red mark in the Actions tab; a passing run that quietly found
      # something would be worse than no watcher at all.
      - name: Fail so this gets noticed
        if: steps.scan.outputs.hits == 'true'
        run: |
          echo "::error::Upstream has shipped security-relevant commits. See the run summary."
          exit 1
